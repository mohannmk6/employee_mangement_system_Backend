spring.application.name=ems
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
ems.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-32-byte-key}
ems.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
ems.admin.email=${EMS_ADMIN_EMAIL:admin@ems.local}
ems.admin.password=${EMS_ADMIN_PASSWORD:ChangeMe123!}
