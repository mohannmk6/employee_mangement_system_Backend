spring.application.name=ems
server.port=8080

# --- AIVEN CLOUD MYSQL CONFIGURATION ---
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-741991-mohannataraj144-e4bb.e.aivencloud.com:28474/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ----------------------------------------

spring.jackson.serialization.write-dates-as-timestamps=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

ems.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-32-byte-key}
ems.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

ems.admin.email=${EMS_ADMIN_EMAIL:admin@ems.local}
